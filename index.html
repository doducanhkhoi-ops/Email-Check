<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mail Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: 'hsl(0 0% 100%)',
                        foreground: 'hsl(240 10% 3.9%)',
                        card: 'hsl(0 0% 100%)',
                        cardForeground: 'hsl(240 10% 3.9%)',
                        primary: 'hsl(240 5.9% 10%)',
                        primaryForeground: 'hsl(0 0% 98%)',
                        secondary: 'hsl(240 4.8% 95.9%)',
                        muted: 'hsl(240 4.8% 95.9%)',
                        mutedForeground: 'hsl(240 3.8% 46.1%)',
                        border: 'hsl(240 5.9% 90%)',
                        input: 'hsl(240 5.9% 90%)',
                        ring: 'hsl(240 10% 3.9%)',
                    },
                    borderRadius: {
                        lg: '0.5rem',
                        md: 'calc(0.5rem - 2px)',
                        sm: 'calc(0.5rem - 4px)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: ui-sans-serif, system-ui, sans-serif; }
        .loader { border: 2px solid #e2e8f0; border-top: 2px solid #0f172a; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Custom scrollbar for categories */
        .category-scroll::-webkit-scrollbar { width: 4px; }
        .category-scroll::-webkit-scrollbar-thumb { background-color: hsl(240 3.8% 46.1%); border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-foreground min-h-screen">
    <div class="max-w-7xl mx-auto p-6">
        <header class="flex flex-col md:flex-row items-start md:items-center justify-between mb-8 pb-4 border-b border-border gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight">Email Dashboard</h1>
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto flex-wrap">
                <select id="accountSelect" class="flex h-10 w-full sm:w-48 items-center justify-between rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                    <option value="default">Đang tải tài khoản...</option>
                </select>
                <select id="timeRange" onchange="toggleCustomDate()" class="flex h-10 w-full sm:w-36 items-center justify-between rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                    <option value="0">Hôm nay</option>
                    <option value="1">Hôm qua</option>
                    <option value="7">7 ngày qua</option>
                    <option value="custom">Ngày cụ thể...</option>
                </select>
                <input type="date" id="customDate" class="hidden h-10 w-full sm:w-36 rounded-md border border-input bg-background px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2">
                <button onclick="loadEmails()" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors bg-primary text-primaryForeground hover:bg-primary/90 h-10 px-4 py-2 shrink-0 shadow">
                    Làm mới
                </button>
            </div>
        </header>

        <div id="loading" class="hidden flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-sm text-muted-foreground animate-pulse">AI đang phân loại email của bạn...</p>
        </div>

        <div id="categoriesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 items-start">
            <!-- Data renders here -->
        </div>
    </div>

    <!-- Modal cho Tóm tắt & Đọc mail -->
    <div id="summaryModal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-background border border-border rounded-lg shadow-xl w-full max-w-6xl h-[85vh] flex flex-col relative" onclick="event.stopPropagation()">
            <!-- Header -->
            <div class="flex items-center justify-between p-4 border-b border-border shrink-0">
                <h2 id="modalSubject" class="text-lg font-semibold truncate pr-4">Đang tải...</h2>
                <button onclick="closeModal()" class="text-muted-foreground hover:text-foreground shrink-0 p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <!-- Body -->
            <div class="flex flex-1 overflow-hidden flex-col md:flex-row">
                <!-- Cột trái: Nội dung gốc -->
                <div class="flex-1 border-r border-border flex flex-col min-h-0 bg-white">
                    <div class="bg-gray-100 px-4 py-2 border-b border-border shrink-0 flex items-center justify-between">
                        <span class="text-xs font-semibold text-gray-600 uppercase tracking-wider">Nội dung gốc</span>
                    </div>
                    <div class="flex-1 relative">
                        <div id="emailLoader" class="absolute inset-0 flex items-center justify-center bg-white/80 z-10">
                            <div class="loader"></div>
                        </div>
                        <iframe id="emailFrame" class="w-full h-full border-0" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
                    </div>
                </div>

                <!-- Cột phải: AI Tóm tắt -->
                <div class="w-full md:w-80 lg:w-96 flex flex-col shrink-0 min-h-0 bg-gray-50">
                    <div class="bg-primary px-4 py-2 shrink-0 flex items-center gap-2 text-primaryForeground">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        <span class="text-xs font-semibold uppercase tracking-wider">AI Tóm tắt</span>
                    </div>
                    <div class="p-5 overflow-y-auto flex-1">
                        <div id="modalLoading" class="flex items-center gap-2 text-sm text-muted-foreground">
                            <div class="loader !w-4 !h-4 !border-2"></div> AI đang phân tích...
                        </div>
                        <div id="modalContent" class="text-sm leading-relaxed hidden prose prose-sm max-w-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleCustomDate() {
            const val = document.getElementById('timeRange').value;
            const dateInput = document.getElementById('customDate');
            if(val === 'custom') {
                dateInput.classList.remove('hidden');
                if(!dateInput.value) dateInput.valueAsDate = new Date();
            } else {
                dateInput.classList.add('hidden');
            }
        }

        async function fetchAccounts() {
            try {
                const res = await fetch('/api/accounts');
                const data = await res.json();
                const select = document.getElementById('accountSelect');
                select.innerHTML = '';
                if (data.accounts && data.accounts.length > 0) {
                    data.accounts.forEach(acc => {
                        const opt = document.createElement('option');
                        opt.value = acc;
                        opt.textContent = acc;
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="default">Chưa có tài khoản</option>';
                }
            } catch(e) {
                console.error("Lỗi tải danh sách tài khoản", e);
            }
        }

        async function loadEmails() {
            const rangeVal = document.getElementById('timeRange').value;
            const account = document.getElementById('accountSelect').value;
            let days = 0;
            let exact_date = null;
            
            if(rangeVal === 'custom') {
                exact_date = document.getElementById('customDate').value;
                if(!exact_date) {
                    alert("Vui lòng chọn một ngày");
                    return;
                }
            } else {
                days = rangeVal;
            }

            const container = document.getElementById('categoriesContainer');
            const loading = document.getElementById('loading');
            
            container.innerHTML = '';
            loading.classList.remove('hidden');
            loading.classList.add('flex');

            try {
                const res = await fetch('/api/emails', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ days, exact_date, account })
                });
                const data = await res.json();
                
                if(data.error) {
                    alert('Lỗi hệ thống: ' + data.error);
                    return;
                }
                renderCategories(data.categories);
            } catch (err) {
                alert('Không thể kết nối đến server backend.');
            } finally {
                loading.classList.add('hidden');
                loading.classList.remove('flex');
            }
        }

        function renderCategories(categories) {
            const container = document.getElementById('categoriesContainer');
            
            for (const [catName, emails] of Object.entries(categories)) {
                if(emails.length === 0) continue;

                const col = document.createElement('div');
                col.className = 'flex flex-col gap-3 bg-secondary/30 p-4 rounded-xl border border-border/50 max-h-[70vh] overflow-y-auto category-scroll shadow-sm';
                
                const header = document.createElement('h3');
                header.className = 'font-semibold text-sm flex items-center justify-between sticky top-0 bg-secondary/90 backdrop-blur pb-2 z-10 -mt-2 pt-2';
                header.innerHTML = `${catName} <span class="bg-primary text-primaryForeground text-xs px-2 py-0.5 rounded-full">${emails.length}</span>`;
                col.appendChild(header);

                emails.forEach(email => {
                    const card = document.createElement('div');
                    card.className = 'bg-card text-cardForeground border border-border rounded-lg p-3 shadow-sm hover:shadow-md transition-all cursor-pointer group hover:border-muted-foreground/30';
                    card.onclick = () => openSummary(email.id, email.subject);
                    
                    card.innerHTML = `
                        <div class="flex items-start justify-between gap-2 mb-1.5">
                            <span class="font-medium text-xs truncate text-muted-foreground">${email.sender}</span>
                            <span class="text-[10px] text-muted-foreground whitespace-nowrap bg-muted px-1.5 rounded">${email.time}</span>
                        </div>
                        <p class="text-sm font-medium leading-tight mb-1.5 line-clamp-2 group-hover:text-black transition-colors">${email.subject}</p>
                        <p class="text-xs text-muted-foreground line-clamp-1">${email.preview}</p>
                    `;
                    col.appendChild(card);
                });

                container.appendChild(col);
            }
        }

        async function openSummary(id, subject) {
            const account = document.getElementById('accountSelect').value;
            const modal = document.getElementById('summaryModal');
            const subjectEl = document.getElementById('modalSubject');
            const loadingEl = document.getElementById('modalLoading');
            const contentEl = document.getElementById('modalContent');
            const emailLoader = document.getElementById('emailLoader');
            const iframe = document.getElementById('emailFrame');

            subjectEl.textContent = subject;
            contentEl.classList.add('hidden');
            loadingEl.classList.remove('hidden');
            loadingEl.classList.add('flex');
            emailLoader.classList.remove('hidden');
            emailLoader.classList.add('flex');
            iframe.srcdoc = '';
            modal.classList.remove('hidden');

            try {
                const res = await fetch('/api/summarize', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id, account })
                });
                const data = await res.json();
                
                loadingEl.classList.add('hidden');
                loadingEl.classList.remove('flex');
                emailLoader.classList.add('hidden');
                emailLoader.classList.remove('flex');
                contentEl.classList.remove('hidden');
                
                // Hiển thị nội dung HTML gốc vào Iframe
                if (data.html_content) {
                    let processedHtml = data.html_content;
                    if (processedHtml.includes('<head>')) {
                        processedHtml = processedHtml.replace('<head>', '<head><base target="_blank">');
                    } else {
                        processedHtml = '<base target="_blank">' + processedHtml;
                    }
                    iframe.srcdoc = processedHtml;
                } else {
                    iframe.srcdoc = '<div style="padding:20px;font-family:sans-serif;color:#666;">Không có nội dung HTML.</div>';
                }
                
                if(data.error) {
                    contentEl.innerHTML = `<span class="text-destructive">${data.error}</span>`;
                } else {
                    let html = data.summary
                        .replace(/\*\*(.*?)\*\*/g, '<strong class="font-semibold text-foreground">$1</strong>')
                        .replace(/\* (.*?)(?=\n|$)/g, '<li class="ml-4 list-disc mt-1">$1</li>');
                    contentEl.innerHTML = html;
                }
            } catch (err) {
                loadingEl.classList.add('hidden');
                emailLoader.classList.add('hidden');
                contentEl.classList.remove('hidden');
                contentEl.innerHTML = '<span class="text-destructive">Lỗi tải tóm tắt</span>';
            }
        }

        function closeModal() {
            document.getElementById('summaryModal').classList.add('hidden');
        }

        document.getElementById('summaryModal').addEventListener('click', closeModal);
        document.addEventListener('DOMContentLoaded', () => {
            fetchAccounts().then(loadEmails);
        });
    </script>
</body>
</html>
