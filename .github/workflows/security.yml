name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security & lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff bandit pip-audit

      - name: Lint with Ruff
        run: ruff check app.py tests/

      - name: Static security scan with Bandit
        run: bandit -r app.py -ll

      - name: Dependency CVE audit with pip-audit
        run: pip-audit -r requirements.txt
